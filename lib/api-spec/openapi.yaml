          type: number
        occurrenceActivities:
          type: array
          description: |
            Per-occurrence defaults for ONE occurrence (quantities/hours as
            done each time, never annualised). Optional; when omitted the
            server derives defaults from defaultActivities.
          items:
            $ref: "#/components/schemas/SelectedActivity"
        occurrenceDonationsGBP:
          type: number
        usualLocation:
          $ref: "#/components/schemas/ActivityLocation"
        sharingOrgId:
          type: string
          nullable: true
          description: Prior org-sharing preference carried onto confirmed occurrences.
      required:
        - label
        - cadence
        - dayOfPeriod
        - defaultActivities
        - defaultDonationsGBP
    RecurringTemplate:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        cadence:
          type: string
          enum:
            - weekly
            - fortnightly
            - monthly
        dayOfPeriod:
          type: integer
        defaultActivities:
          type: array
          items:
            $ref: "#/components/schemas/SelectedActivity"
        defaultDonationsGBP:
          type: number
        occurrenceActivities:
          type: array
          description: Per-occurrence defaults (stored, or derived from annual defaults for legacy templates).
          items:
            $ref: "#/components/schemas/SelectedActivity"
        occurrenceDonationsGBP:
          type: number
        usualLocation:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityLocation"
        sharingOrgId:
          type: string
          nullable: true
        occurrencesPerYear:
          type: integer
          description: 52 for weekly, 26 for fortnightly, 12 for monthly — for forecast display only.
        anchorDate:
          type: string
        lastConfirmedAt:
          type: string
          nullable: true
        lastSkippedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        nextDueDate:
          type: string
        dueOccurrenceDate:
          type: string
          nullable: true
          description: |
            The scheduled occurrence the due prompt refers to (most recent on
            or before today). Null while the template's first scheduled
            occurrence is still in the future — the template is never due and
            cannot be logged until then.
        isDue:
          type: boolean
      required:
        - id
        - label
        - cadence
        - dayOfPeriod
        - defaultActivities
        - defaultDonationsGBP
        - occurrenceActivities
        - occurrenceDonationsGBP
        - occurrencesPerYear
        - anchorDate
        - createdAt
        - nextDueDate
        - dueOccurrenceDate
        - isDue
