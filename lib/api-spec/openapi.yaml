openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: My Impact API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: impact
    description: Impact calculation operations
  - name: profile
    description: User profile operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /impact/calculate:
    post:
      operationId: calculateImpact
      tags: [impact]
      summary: Calculate personal social value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImpactInput"
      responses:
        "200":
          description: Calculated impact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactResult"
  /impact/activities:
    get:
      operationId: getActivities
      tags: [impact]
      summary: Get available activities from Social Value Engine proxy library
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitiesResponse"
  /impact/suggestions:
    post:
      operationId: getSuggestions
      tags: [impact]
      summary: Get suggested activities based on user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionsInput"
      responses:
        "200":
          description: Suggested activities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"
  /impact/save:
    post:
      operationId: saveImpact
      tags: [impact]
      summary: Save a user's impact record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveImpactInput"
      responses:
        "200":
          description: Saved impact record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedImpact"
  /impact/history:
    get:
      operationId: getImpactHistory
      tags: [impact]
      summary: Get impact history for a user
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: tags
          in: query
          required: false
          description: Comma-separated list of tag names to filter by (records must contain all)
          schema:
            type: string
        - name: year
          in: query
          required: false
          description: Filter to entries whose entryDate falls in this calendar year (UTC).
          schema:
            type: integer
      responses:
        "200":
          description: Impact history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactHistoryResponse"
  /impact/years:
    get:
      operationId: listImpactYears
      tags: [impact]
      summary: List the calendar years the authenticated user has entries in
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of years with entry counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactYearsResponse"
        "401":
          description: Not authenticated
  /impact/year-rollover:
    get:
      operationId: getYearRollover
      tags: [impact]
      summary: Get the year-rollover prompt state for the authenticated user
      description: |
        Returns whether a year-rollover prompt should be shown (the user has not
        yet confirmed habits for the current calendar year and at least one
        prior year had logged entries), along with the list of ongoing habits
        from `recurring_templates` so the UI can render checkboxes.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Rollover state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearRolloverResponse"
        "401":
          description: Not authenticated
    post:
      operationId: confirmYearRollover
      tags: [impact]
      summary: Confirm carried-forward habits for the new calendar year
      description: |
        Bulk-creates 12 monthly impact entries (Jan–Dec, dated to the 1st of
        each month) for every confirmed habit in the new year. Habits that
        already have entries in this year are skipped.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YearRolloverConfirmInput"
      responses:
        "200":
          description: Carry-forward done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearRolloverConfirmResponse"
        "401":
          description: Not authenticated
  /impact/all:
    delete:
      operationId: deleteAllImpactRecords
      tags: [impact]
      summary: Delete all impact records for the authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: All records deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAllImpactRecordsResponse"
        "401":
          description: Not authenticated
  /impact/{id}:
    patch:
      operationId: updateImpactRecord
      tags: [impact]
      summary: Update the period label of an impact record
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateImpactRecordInput"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateImpactRecordResponse"
        "401":
          description: Not authenticated
        "404":
          description: Not found
    delete:
      operationId: deleteImpactRecord
      tags: [impact]
      summary: Delete a single impact record
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteImpactRecordResponse"
        "401":
          description: Not authenticated
        "404":
          description: Not found
  /impact/recap/{year}:
    get:
      operationId: getAnnualRecap
      tags: [impact]
      summary: Get an annual recap (Spotify-Wrapped-style) for the authenticated user
      security:
        - cookieAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Annual recap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnualRecapResponse"
        "401":
          description: Not authenticated
  /impact/templates:
    get:
      operationId: listRecurringTemplates
      tags: [impact]
      summary: List recurring activity templates for the authenticated user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of templates with computed dueness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTemplatesResponse"
        "401":
          description: Not authenticated
    post:
      operationId: createRecurringTemplate
      tags: [impact]
      summary: Create a recurring activity template
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTemplateInput"
      responses:
        "200":
          description: Created template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTemplate"
        "400":
          description: Invalid input
        "401":
          description: Not authenticated
  /impact/templates/{id}:
    patch:
      operationId: updateRecurringTemplate
      tags: [impact]
      summary: Update a recurring activity template
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringTemplateInput"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTemplate"
        "401":
          description: Not authenticated
        "404":
          description: Not found
    delete:
      operationId: deleteRecurringTemplate
      tags: [impact]
      summary: Delete a recurring activity template
      description: |
        Untoggling a habit. Pass `removeFutureEntries=true` to also delete
        every habit-generated impact entry for this template dated to the
        current month or later. Past months are always preserved so totals
        for prior calendar years don't shift retroactively.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: removeFutureEntries
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteRecurringTemplateResponse"
        "401":
          description: Not authenticated
        "404":
          description: Not found
  /impact/templates/{id}/confirm:
    post:
      operationId: confirmRecurringTemplate
      tags: [impact]
      summary: Mark a template's current scheduled occurrence as confirmed
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Confirmed template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringTemplate"
        "401":
          description: Not authenticated
        "404":
          description: Not found
  /profile/ack-streak-milestone:
    post:
      operationId: ackStreakMilestone
      tags: [profile]
      summary: Record acknowledgement of a streak milestone celebration
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                milestone:
                  type: integer
              required:
                - milestone
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreakInfo"
        "401":
          description: Not authenticated
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user profile
      security:
        - cookieAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: Not authenticated
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Upsert current user profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: Not authenticated
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ActivityItem:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        shortName:
          type: string
        category:
          type: string
        proxy:
          type: string
        proxyYear:
          type: string
        unit:
          type: string
        unitLabel:
          type: string
        friendlyQuestion:
          type: string
        defaultQuantity:
          type: number
        valuePerUnit:
          type: number
        sdg:
          type: string
        sdgColor:
          type: string
        description:
          type: string
      required:
        - id
        - name
        - shortName
        - category
        - proxy
        - proxyYear
        - unit
        - unitLabel
        - friendlyQuestion
        - defaultQuantity
        - valuePerUnit
        - sdg
        - sdgColor
        - description
    ActivitiesResponse:
      type: object
      properties:
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        categories:
          type: array
          items:
            type: string
      required:
        - activities
        - categories
    SelectedActivity:
      type: object
      properties:
        activityId:
          type: string
        quantity:
          type: number
        hoursPerYear:
          type: number
        description:
          type: string
      required:
        - activityId
        - quantity
        - hoursPerYear
    CustomActivityInput:
      type: object
      properties:
        activityId:
          type: string
        name:
          type: string
        quantity:
          type: number
        hoursPerYear:
          type: number
        valuePerUnit:
          type: number
        unit:
          type: string
        proxy:
          type: string
        proxyYear:
          type: string
        sdg:
          type: string
        sdgColor:
          type: string
      required:
        - activityId
        - name
        - quantity
        - hoursPerYear
        - valuePerUnit
        - unit
        - proxy
        - proxyYear
        - sdg
        - sdgColor
    ImpactInput:
      type: object
      properties:
        description:
          type: string
        activities:
          type: array
          items:
            $ref: "#/components/schemas/SelectedActivity"
        customActivities:
          type: array
          items:
            $ref: "#/components/schemas/CustomActivityInput"
        donationsGBP:
          type: number
        additionalVolunteerHours:
          type: number
      required:
        - description
        - activities
        - donationsGBP
        - additionalVolunteerHours
    ActivityBreakdown:
      type: object
      properties:
        activityId:
          type: string
        activityName:
          type: string
        category:
          type: string
        proxy:
          type: string
        proxyYear:
          type: string
        sdg:
          type: string
        sdgColor:
          type: string
        impactValue:
          type: number
        hours:
          type: number
      required:
        - activityId
        - activityName
        - category
        - sdg
        - sdgColor
        - impactValue
        - hours
    ImpactResult:
      type: object
      properties:
        totalValue:
          type: number
        impactValue:
          type: number
        contributionValue:
          type: number
        donationsValue:
          type: number
        personalDevelopmentValue:
          type: number
        totalHours:
          type: number
        activityBreakdowns:
          type: array
          items:
            $ref: "#/components/schemas/ActivityBreakdown"
        sdgBreakdowns:
          type: array
          items:
            type: object
            properties:
              sdg:
                type: string
              sdgColor:
                type: string
              value:
                type: number
            required:
              - sdg
              - sdgColor
              - value
        explanations:
          type: object
          properties:
            impact:
              type: string
            contribution:
              type: string
            donations:
              type: string
            personalDevelopment:
              type: string
          required:
            - impact
            - contribution
            - donations
            - personalDevelopment
      required:
        - totalValue
        - impactValue
        - contributionValue
        - donationsValue
        - personalDevelopmentValue
        - totalHours
        - activityBreakdowns
        - sdgBreakdowns
        - explanations
    SaveImpactInput:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        period:
          type: string
          nullable: true
        entryDate:
          type: string
          nullable: true
          description: |
            ISO date (YYYY-MM-DD) the entry counts toward. Determines which
            calendar year and month the entry shows up in. Defaults to today
            when omitted. Any past date — current year or prior years — is
            allowed.
        impactResult:
          $ref: "#/components/schemas/ImpactResult"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/SelectedActivity"
        customActivities:
          type: array
          items:
            $ref: "#/components/schemas/CustomActivityInput"
        donationsGBP:
          type: number
        additionalVolunteerHours:
          type: number
        region:
          type: string
          nullable: true
        outwardCode:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        targetRecordId:
          type: string
          nullable: true
          description: |
            When set, /save updates this specific record (must be owned by
            the caller) instead of creating a new one. Used by the History
            "edit" flow so backdated edits move records to the correct
            calendar year without leaving an orphan.
        force:
          type: boolean
          nullable: true
          description: |
            Bypass the habit-overlap check. By default, /save returns 409
            when the entryDate's month already has a habit-generated entry
            with any overlapping activity, so the UI can prompt the user to
            edit that entry instead of silently double-counting. Set true
            to log an additional entry anyway.
      required:
        - userId
        - name
        - activities
        - donationsGBP
        - additionalVolunteerHours
    SavedImpact:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        period:
          type: string
          nullable: true
        createdAt:
          type: string
        entryDate:
          type: string
          description: ISO date the entry counts toward (YYYY-MM-DD).
        source:
          type: string
          description: |
            "user" | "habit" | "retrospective" | "member-submitted" — describes
            how the entry was created so the UI can label it (e.g. show a
            "from your habit" badge on bulk-created monthly entries).
        habitTemplateId:
          type: integer
          nullable: true
          description: |
            ID of the recurring template that generated this entry, if any.
            Lets the client cross-reference bulk-created monthly entries with
            their parent habit.
        impactResult:
          $ref: "#/components/schemas/ImpactResult"
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - userId
        - name
        - createdAt
        - entryDate
        - source
        - impactResult
        - tags
    ImpactYearsResponse:
      type: object
      properties:
        years:
          type: array
          items:
            type: object
            properties:
              year:
                type: integer
              entryCount:
                type: integer
            required:
              - year
              - entryCount
        currentYear:
          type: integer
      required:
        - years
        - currentYear
    YearRolloverHabit:
      type: object
      properties:
        templateId:
          type: integer
        label:
          type: string
        defaultDonationsGBP:
          type: number
        defaultActivities:
          type: array
          items:
            $ref: "#/components/schemas/SelectedActivity"
      required:
        - templateId
        - label
        - defaultDonationsGBP
        - defaultActivities
    YearRolloverResponse:
      type: object
      properties:
        shouldShow:
          type: boolean
          description: |
            True when the user is on/after 1 January of the new calendar year
            and has not yet confirmed habits for it (and at least one prior
            year had entries).
        priorYear:
          type: integer
          nullable: true
        priorYearTotalValue:
          type: number
          nullable: true
        priorYearTotalHours:
          type: number
          nullable: true
        currentYear:
          type: integer
        habits:
          type: array
          items:
            $ref: "#/components/schemas/YearRolloverHabit"
      required:
        - shouldShow
        - currentYear
        - habits
    YearRolloverConfirmInput:
      type: object
      properties:
        confirmedTemplateIds:
          type: array
          items:
            type: integer
      required:
        - confirmedTemplateIds
    YearRolloverConfirmResponse:
      type: object
      properties:
        entriesCreated:
          type: integer
        year:
          type: integer
      required:
        - entriesCreated
        - year
    ImpactHistoryResponse:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: "#/components/schemas/SavedImpact"
        streak:
          $ref: "#/components/schemas/StreakInfo"
      required:
        - records
    SuggestionsInput:
      type: object
      properties:
        currentActivities:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        availableHoursPerWeek:
          type: number
      required:
        - currentActivities
        - availableHoursPerWeek
    SuggestionItem:
      type: object
      properties:
        activityId:
          type: string
        activityName:
          type: string
        category:
          type: string
        sdg:
          type: string
        sdgColor:
          type: string
        reason:
          type: string
        estimatedImpactPerYear:
          type: number
        recommendedHoursPerWeek:
          type: number
      required:
        - activityId
        - activityName
        - category
        - sdg
        - sdgColor
        - reason
        - estimatedImpactPerYear
        - recommendedHoursPerWeek
    SuggestionsResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/SuggestionItem"
      required:
        - suggestions
    UserProfileData:
      type: object
      properties:
        situation:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        postcode:
          type: string
          nullable: true
        updatedAt:
          type: string
    StreakInfo:
      type: object
      properties:
        current:
          type: integer
        longest:
          type: integer
        atRisk:
          type: boolean
        weekStart:
          type: string
        nextMilestone:
          type: integer
          nullable: true
        lastAckedMilestone:
          type: integer
      required:
        - current
        - longest
        - atRisk
        - weekStart
        - lastAckedMilestone
    ProfileResponse:
      type: object
      properties:
        profile:
          oneOf:
            - $ref: "#/components/schemas/UserProfileData"
            - type: "null"
        streak:
          $ref: "#/components/schemas/StreakInfo"
      required:
        - profile
    ProfileInput:
      type: object
      properties:
        situation:
          type: array
          items:
            type: string
        interests:
          type: array
          items:
            type: string
        postcode:
          type: string
          nullable: true
    UpdateImpactRecordInput:
      type: object
      properties:
        periodLabel:
          type: string
        entryDate:
          type: string
          description: |
            ISO date (YYYY-MM-DD) the entry counts toward. Updating this
            moves the record to a different calendar month / year so the
            History year-picker totals stay accurate.
        tags:
          type: array
          items:
            type: string
    UpdateImpactRecordResponse:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        period:
          type: string
          nullable: true
        createdAt:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
        - id
        - userId
        - name
        - createdAt
        - tags
    DeleteImpactRecordResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    DeleteAllImpactRecordsResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AnnualRecapTopActivity:
      type: object
      properties:
        activityId:
          type: string
        activityName:
          type: string
        category:
          type: string
        sdg:
          type: string
        sdgColor:
          type: string
        impactValue:
          type: number
        hours:
          type: number
      required:
        - activityId
        - activityName
        - category
        - sdg
        - sdgColor
        - impactValue
        - hours
    AnnualRecapTopSdg:
      type: object
      properties:
        sdg:
          type: string
        sdgColor:
          type: string
        value:
          type: number
      required:
        - sdg
        - sdgColor
        - value
    AnnualRecapBiggestSession:
      type: object
      properties:
        recordId:
          type: string
        name:
          type: string
        period:
          type: string
          nullable: true
        totalValue:
          type: number
        totalHours:
          type: number
        createdAt:
          type: string
      required:
        - recordId
        - name
        - totalValue
        - totalHours
        - createdAt
    AnnualRecapJournalHighlight:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        prompt:
          type: string
          nullable: true
        createdAt:
          type: string
      required:
        - id
        - text
        - createdAt
    AnnualRecapResponse:
