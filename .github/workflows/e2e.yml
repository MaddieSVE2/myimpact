name: E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myimpact_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myimpact_e2e
      SESSION_SECRET: e2e-ci-session-secret-not-for-prod
      E2E_TEST_MODE: "1"
      E2E_MANAGED_SERVERS: "1"
      ENABLE_DEMO_LOGIN: "true"
      NODE_ENV: development
      APP_URL: http://localhost:24656
      ALLOWED_ORIGINS: http://localhost:24656
      CI: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Install Playwright browsers
        run: pnpm --filter @workspace/e2e run install-browsers

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results
          retention-days: 14
