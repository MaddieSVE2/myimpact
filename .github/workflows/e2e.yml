name: E2E

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myimpact_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/myimpact_e2e
      SESSION_SECRET: e2e-ci-session-secret-not-for-prod
      E2E_TEST_MODE: "1"
      E2E_MANAGED_SERVERS: "1"
      ENABLE_DEMO_LOGIN: "true"
      NODE_ENV: development
      APP_URL: http://localhost:24656
      ALLOWED_ORIGINS: http://localhost:24656
      CI: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The migrations assume the original tables (users and the rest), which
      # were created before migrations existed, so they can't build a
      # database from empty. Create the tables from the schema first; every
      # migration then applies cleanly on top. Safe here because the
      # database is empty, so push has nothing to ask about.
      - name: Create tables from the schema
        run: pnpm --filter @workspace/db run push-force

      - name: Run migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Install Playwright browsers
        run: pnpm --filter @workspace/e2e run install-browsers

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: tests/e2e/test-results
          retention-days: 14
