name: Bundle Size

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: bundle-size-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-size:
    name: Bundle size budgets (my-impact)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build my-impact
        run: pnpm --filter @workspace/my-impact run build

      - name: Check bundle size budgets
        run: node scripts/check-bundle-size.mjs
