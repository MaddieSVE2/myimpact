name: SW E2E

on:
  pull_request:
    paths:
      # The service worker itself — the primary thing this guards.
      - "artifacts/my-impact/public/service-worker.js"
      # The static server applies the cache headers the SW relies on.
      - "artifacts/my-impact/serve.mjs"
      # Vite config controls hashed filenames + dev/preview cache headers.
      - "artifacts/my-impact/vite.config.ts"
      # The HTML shell that the SW caches network-first.
      - "artifacts/my-impact/index.html"
      # Where the SW is registered.
      - "artifacts/my-impact/src/main.tsx"
      # Build output: any committed dist/ change is, by definition, a
      # change to what the SW will cache, so re-run the guardrail.
      - "artifacts/my-impact/dist/**"
      - "tests/sw-e2e/**"
      - ".github/workflows/sw-e2e.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/my-impact/public/service-worker.js"
      - "artifacts/my-impact/serve.mjs"
      - "artifacts/my-impact/vite.config.ts"
      - "artifacts/my-impact/index.html"
      - "artifacts/my-impact/src/main.tsx"
      - "artifacts/my-impact/dist/**"
      - "tests/sw-e2e/**"
      - ".github/workflows/sw-e2e.yml"

jobs:
  playwright:
    name: Service-worker redeploy guard
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "1"
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @workspace/sw-e2e run install-browsers

      - name: Run service-worker e2e
        run: pnpm test:sw-e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sw-e2e-report
          path: tests/sw-e2e/playwright-report
          retention-days: 14

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sw-e2e-traces
          path: tests/sw-e2e/test-results
          retention-days: 14
